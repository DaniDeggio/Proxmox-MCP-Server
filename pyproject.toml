[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deggio-infra-mcp"
version = "0.1.0"
description = "Homelab infrastructure MCP server for automated service provisioning on Proxmox LXC containers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Deggio" },
]
keywords = ["proxmox", "mcp", "homelab", "automation", "lxc", "infrastructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastmcp>=2.0.0",
    "proxmoxer>=2.0.1,<3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "structlog>=24.0.0",
    "paramiko>=5.0.0,<6.0.0",
    "anyio>=4.0.0",
    "requests>=2.31.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
    "types-PyYAML",
    "types-paramiko",
    "types-requests",
    "respx>=0.22.0",
]

[project.scripts]
deggio-infra-mcp = "deggio_infra_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deggio_infra_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["deggio_infra_mcp"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
